<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PlayGuard · App Intelligence{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}"><span class="brand-icon">P</span><span>PlayGuard<small>APP INTELLIGENCE</small></span></a>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>
    <nav id="nav">
      <a class="{{ 'active' if active=='home' else '' }}" href="{{ url_for('home') }}">Home</a>
      <a class="{{ 'active' if active=='dashboard' else '' }}" href="{{ url_for('dashboard') }}">Dashboard</a>
      <a class="{{ 'active' if active=='analyzer' else '' }}" href="{{ url_for('analyzer') }}">Analyze app</a>
      <a class="{{ 'active' if active=='visualizations' else '' }}" href="{{ url_for('visualizations') }}">Model results</a>
      <a class="{{ 'active' if active=='dataset' else '' }}" href="{{ url_for('dataset') }}">Dataset</a>
      <a class="{{ 'active' if active=='about' else '' }}" href="{{ url_for('about') }}">About</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><div class="footer-brand">PlayGuard <span>· Data science project</span></div><p>Demo research tool. Flags are not proof of fraud.</p></footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body></html>
